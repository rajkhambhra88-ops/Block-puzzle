<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Puzzle Game - Perfect</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #2b3a8a, #1a2350);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            touch-action: none;
        }

        #score-container {
            font-size: 55px;
            font-weight: 800;
            margin-top: 15px;
            margin-bottom: 15px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        #game-container {
            position: relative;
            background-color: #151b36; 
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.5);
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 3px;
            width: 92vw;
            max-width: 400px;
            height: 92vw;
            max-height: 400px;
        }

        .cell {
            background-color: #0b1021;
            border-radius: 6px;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* --- 3D ब्लॉक डिज़ाइन --- */
        .block {
            border-radius: 6px;
            width: 100%;
            height: 100%;
            position: relative;
            box-shadow: 
                inset -2px -3px 5px rgba(0,0,0,0.5), 
                inset 3px 3px 6px rgba(255,255,255,0.6),
                0 2px 4px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* --- अलग-अलग चमकदार रंग --- */
        .c-blue { background: linear-gradient(135deg, #5b9bff, #2b6eeb); }
        .c-orange { background: linear-gradient(135deg, #ff9f43, #e67e22); }
        .c-yellow { background: linear-gradient(135deg, #f9ca24, #f0932b); }
        .c-teal { background: linear-gradient(135deg, #1dd1a1, #10ac84); }
        .c-purple { background: linear-gradient(135deg, #a55eea, #8854d0); }
        .c-green { background: linear-gradient(135deg, #2ed573, #1eae48); }
        .c-red { background: linear-gradient(135deg, #ff6b81, #ee5253); }
        .c-pink { background: linear-gradient(135deg, #ff9ff3, #f368e0); }

        #pieces-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 92vw;
            max-width: 400px;
            height: 120px;
            margin-top: 25px;
        }

        .piece-holder {
            width: 33%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .draggable-piece {
            display: grid;
            gap: 3px;
            cursor: grab;
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5));
        }

        #drag-element {
            position: fixed;
            display: grid;
            gap: 3px;
            pointer-events: none; 
            z-index: 1000;
            top: 0;
            left: 0;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.7));
            opacity: 0.9;
        }

        #game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            z-index: 2000;
        }
        
        #game-over h2 { 
            margin-bottom: 25px; 
            font-size: 38px; 
            color: #fff; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }
        
        button {
            padding: 14px 35px;
            font-size: 22px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #00ff88, #00b85c);
            color: #000;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,255,136,0.4), inset 0 2px 5px rgba(255,255,255,0.5);
            transition: transform 0.1s;
        }
        
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="score-container">0</div>

    <div id="game-container">
        <div id="grid"></div>
        <div id="game-over">
            <h2>GAME OVER</h2>
            <button onclick="initGame()">Play Again</button>
        </div>
    </div>

    <div id="pieces-container">
        <div class="piece-holder" id="holder-0"></div>
        <div class="piece-holder" id="holder-1"></div>
        <div class="piece-holder" id="holder-2"></div>
    </div>

    <div id="drag-element" style="display: none;"></div>

<script>
    const GRID_SIZE = 8;
    let grid = [];
    let score = 0;
    let currentPieces = [null, null, null];
    
    let draggedPiece = null;
    let draggedIndex = -1;
    let dragX = 0, dragY = 0;

    const colors = ['c-blue', 'c-orange', 'c-yellow', 'c-teal', 'c-purple', 'c-green', 'c-red', 'c-pink'];

    const shapes = [
        [[1]], // 1x1
        [[1, 1]], // 1x2
        [[1], [1]], // 2x1
        [[1, 1, 1]], // 1x3
        [[1], [1], [1]], // 3x1
        [[1, 1, 1, 1]], // 1x4
        [[1], [1], [1], [1]], // 4x1
        [[1, 1], [1, 1]], // 2x2
        [[1, 1, 1], [1, 1, 1], [1, 1, 1]], // 3x3
        [[1, 0], [1, 1]], // L-Shape
        [[0, 1], [1, 1]], // Reverse L
        [[1, 1], [1, 0]], // L-Shape
        [[1, 1], [0, 1]], // Reverse L
        [[1, 1, 1], [0, 1, 0]] // T-Shape
    ];

    function initGame() {
        score = 0;
        document.getElementById('score-container').innerText = score;
        document.getElementById('game-over').style.display = 'none';
        
        // बोर्ड को खाली करें
        grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        renderGrid();
        generatePieces();
    }

    function renderGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                if (grid[r][c]) {
                    const block = document.createElement('div');
                    block.className = `block ${grid[r][c]}`;
                    cell.appendChild(block);
                }
                gridEl.appendChild(cell);
            }
        }
    }

    function generatePieces() {
        currentPieces = [];
        for (let i = 0; i < 3; i++) {
            const randomShape = shapes[Math.floor(Math.random() * shapes.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            currentPieces.push({ shape: randomShape, color: randomColor });
            renderPieceInHolder(i, randomShape, randomColor);
        }
    }

    function renderPieceInHolder(index, shape, color) {
        const holder = document.getElementById(`holder-${index}`);
        holder.innerHTML = '';
        
        const pieceEl = document.createElement('div');
        pieceEl.className = 'draggable-piece';
        
        const pCellSize = window.innerWidth < 400 ? 24 : 32;
        
        pieceEl.style.gridTemplateColumns = `repeat(${shape[0].length}, ${pCellSize}px)`;
        pieceEl.style.gridTemplateRows = `repeat(${shape.length}, ${pCellSize}px)`;

        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                const cellDiv = document.createElement('div');
                if (shape[r][c] === 1) {
                    cellDiv.className = `block ${color}`;
                }
                pieceEl.appendChild(cellDiv);
            }
        }

        pieceEl.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            startDrag(e, index, shape, color, pieceEl);
        });
        
        holder.appendChild(pieceEl);
    }

    function startDrag(e, index, shape, color, originalEl) {
        if (currentPieces[index] === null) return;

        draggedPiece = { shape, color };
        draggedIndex = index;

        const gridRect = document.getElementById('grid').getBoundingClientRect();
        const cellSize = (gridRect.width - 18) / GRID_SIZE;

        const dragEl = document.getElementById('drag-element');
        dragEl.innerHTML = '';
        dragEl.style.gridTemplateColumns = `repeat(${shape[0].length}, ${cellSize}px)`;
        dragEl.style.gridTemplateRows = `repeat(${shape.length}, ${cellSize}px)`;

        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                const cellDiv = document.createElement('div');
                if (shape[r][c] === 1) {
                    cellDiv.className = `block ${color}`;
                }
                dragEl.appendChild(cellDiv);
            }
        }

        dragEl.style.display = 'grid';
        
        dragX = e.clientX;
        dragY = e.clientY - 60; 
        updateDragElementPosition();

        originalEl.style.visibility = 'hidden';

        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', onDragEnd);
    }

    function updateDragElementPosition() {
        const dragEl = document.getElementById('drag-element');
        dragEl.style.transform = `translate(${dragX}px, ${dragY}px) translate(-50%, -50%)`;
    }

    function onDragMove(e) {
        if (!draggedPiece) return;
        dragX = e.clientX;
        dragY = e.clientY - 60;
        updateDragElementPosition();
        highlightGrid();
    }

    function highlightGrid() {
        document.querySelectorAll('.cell').forEach(c => {
            c.style.backgroundColor = '#0b1021';
        });

        const placement = getGridPlacement();
        if (placement && canPlacePiece(placement.row, placement.col, draggedPiece.shape)) {
            const shape = draggedPiece.shape;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c] === 1) {
                        const cell = document.querySelector(`.cell[data-row="${placement.row + r}"][data-col="${placement.col + c}"]`);
                        if (cell) cell.style.backgroundColor = 'rgba(0, 255, 136, 0.4)'; 
                    }
                }
            }
        }
    }

    function getGridPlacement() {
        const gridEl = document.getElementById('grid');
        const gridRect = gridEl.getBoundingClientRect();
        
        const relativeX = dragX - gridRect.left;
        const relativeY = dragY - gridRect.top;

        if (relativeX < -50 || relativeY < -50 || relativeX > gridRect.width + 50 || relativeY > gridRect.height + 50) {
            return null;
        }

        const cellWidth = gridRect.width / GRID_SIZE;
        const cellHeight = gridRect.height / GRID_SIZE;

        let col = Math.round(relativeX / cellWidth - (draggedPiece.shape[0].length / 2));
        let row = Math.round(relativeY / cellHeight - (draggedPiece.shape.length / 2));

        return { row, col };
    }

    function onDragEnd(e) {
        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', onDragEnd);

        document.querySelectorAll('.cell').forEach(c => {
            c.style.backgroundColor = '#0b1021';
        });

        if (!draggedPiece) return;

        const placement = getGridPlacement();
        let placed = false;

        if (placement && canPlacePiece(placement.row, placement.col, draggedPiece.shape)) {
            placePiece(placement.row, placement.col, draggedPiece);
            placed = true;
        }

        if (placed) {
            // ब्लॉक को स्थायी रूप से हटाएं
            currentPieces[draggedIndex] = null;
            const holder = document.getElementById(`holder-${draggedIndex}`);
            holder.innerHTML = ''; 

            checkLines();
            
            // गेम ओवर चेक
            if (isGameOver()) {
                document.getElementById('game-over').style.display = 'flex';
            } else if (currentPieces.every(p => p === null)) {
                generatePieces();
            }
        } else {
            // अगर गलत जगह छोड़ा, तो ब्लॉक को वापस नीचे दिखाएं
            const originalEl = document.getElementById(`holder-${draggedIndex}`).firstChild;
            if(originalEl) originalEl.style.visibility = 'visible';
        }

        document.getElementById('drag-element').style.display = 'none';
        draggedPiece = null;
        draggedIndex = -1;
    }

    // चेक करता है कि ब्लॉक उस जगह पर फिट हो सकता है या नहीं
    function canPlacePiece(row, col, shape) {
        if (row < 0 || col < 0 || row + shape.length > GRID_SIZE || col + shape[0].length > GRID_SIZE) {
            return false; 
        }
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c] === 1 && grid[row + r][col + c] !== null) {
                    return false; 
                }
            }
        }
        return true;
    }

    function placePiece(row, col, pieceData) {
        const shape = pieceData.shape;
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c] === 1) {
                    grid[row + r][col + c] = pieceData.color;
                    score += 1;
                }
            }
        }
        document.getElementById('score-container').innerText = score;
        renderGrid();
    }

    function checkLines() {
        let rowsToClear = [];
        let colsToClear = [];

        for (let r = 0; r < GRID_SIZE; r++) {
            if (grid[r].every(cell => cell !== null)) rowsToClear.push(r);
        }
        for (let c = 0; c < GRID_SIZE; c++) {
            let isFull = true;
            for (let r = 0; r < GRID_SIZE; r++) {
                if (grid[r][c] === null) { isFull = false; break; }
            }
            if (isFull) colsToClear.push(c);
        }

        if (rowsToClear.length > 0 || colsToClear.length > 0) {
            score += (rowsToClear.length * 10) + (colsToClear.length * 10);
            document.getElementById('score-container').innerText = score;

            rowsToClear.forEach(r => { for (let c = 0; c < GRID_SIZE; c++) grid[r][c] = null; });
            colsToClear.forEach(c => { for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = null; });
            
            renderGrid();
        }
    }

    // --- असली गेम ओवर लॉजिक ---
    function isGameOver() {
        // 3 में से जो भी ब्लॉक बचे हैं, उन्हें एक-एक करके चेक करें
        for (let i = 0; i < 3; i++) {
            const piece = currentPieces[i];
            
            // अगर वह ब्लॉक पहले ही खेल लिया गया है (null है), तो उसे चेक न करें
            if (piece === null) continue; 
            
            const shape = piece.shape;
            
            // बोर्ड के हर एक खाने (0 से 7 तक) पर चेक करें
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    // अगर कोई भी बचा हुआ ब्लॉक कहीं भी फिट हो सकता है, तो गेम ओवर नहीं है
                    if (canPlacePiece(r, c, shape)) {
                        return false; 
                    }
                }
            }
        }
        // अगर सारे ब्लॉक चेक करने के बाद भी कोई जगह नहीं मिली, तो गेम ओवर
        return true; 
    }

    window.addEventListener('resize', renderGrid);

    // गेम शुरू करें
    initGame();
</script>
</body>
</html>
